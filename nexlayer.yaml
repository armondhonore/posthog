application:
  name: posthog
  pods:
  - name: app
    image: posthog/posthog:latest
    path: /
    servicePorts:
    - 8000
    vars:
      DATABASE_URL: "postgresql://posthog:posthog@posthog-postgres-service:5432/posthog"
      REDIS_URL: "redis://posthog-redis-service:6379"
      # ClickHouse (event store)
      CLICKHOUSE_HOST: "posthog-clickhouse-service"
      CLICKHOUSE_DATABASE: "posthog"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      # Kafka (event ingestion bus)
      KAFKA_HOSTS: "posthog-kafka-service:9092"
      KAFKA_URL: "kafka://posthog-kafka-service:9092"
      KAFKA_PRODUCER_ACKS: "1"
      SECRET_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      SITE_URL: "https://relaxed-weasel-posthog.cloud.nexlayer.ai"
      IS_BEHIND_PROXY: "true"
      DISABLE_SECURE_SSL_REDIRECT: "true"
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
    volumes:
    - name: posthog-db
      mountPath: /var/lib/postgresql/data
      size: 10Gi
  - name: redis
    image: redis:7-alpine
    servicePorts:
    - 6379
  - name: clickhouse
    image: clickhouse/clickhouse-server:24-alpine
    servicePorts:
    - 8123
    - 9000
    vars:
      CLICKHOUSE_DB: "posthog"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: ""
    volumes:
    - name: posthog-clickhouse
      mountPath: /var/lib/clickhouse
      size: 20Gi
  - name: kafka
    image: apache/kafka:3.8.0
    servicePorts:
    - 9092
    vars:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://posthog-kafka-service:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
    - name: posthog-kafka
      mountPath: /var/lib/kafka/data
      size: 10Gi
