application:
  name: posthog
  pods:
  - name: app
    image: us-east1-docker.pkg.dev/capture-by-auditdeploy/nexlayer-agent/posthog-singlenode:v3
    path: /
    servicePorts:
    - 8000
    vars:
      CLICKHOUSE_SINGLE_NODE: "true"
      DATABASE_URL: "postgresql://posthog:posthog@postgres.pod:5432/posthog"
      REDIS_URL: "redis://redis.pod:6379"
      CLICKHOUSE_HOST: "clickhouse.pod"
      CLICKHOUSE_DATABASE: "posthog"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_VERIFY: "false"
      KAFKA_HOSTS: "kafka.pod:9092"
      SECRET_KEY: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
      SITE_URL: "https://relaxed-weasel-posthog.cloud.nexlayer.ai"
      IS_BEHIND_PROXY: "true"
      DISABLE_SECURE_SSL_REDIRECT: "true"
  - name: postgres
    image: mirror.gcr.io/library/postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: posthog
      POSTGRES_USER: posthog
      POSTGRES_PASSWORD: posthog
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
    - name: posthog-db
      mountPath: /var/lib/postgresql
      size: 10Gi
  - name: redis
    image: mirror.gcr.io/library/redis:7-alpine
    servicePorts:
    - 6379
  - name: clickhouse
    image: mirror.gcr.io/clickhouse/clickhouse-server:24-alpine
    servicePorts:
    - 8123
    - 9000
    vars:
      CLICKHOUSE_DB: "posthog"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
    - name: posthog-clickhouse
      mountPath: /var/lib/clickhouse
      size: 20Gi
  - name: kafka
    image: mirror.gcr.io/apache/kafka:3.8.0
    servicePorts:
    - 9092
    - 9093
    vars:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka.pod:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka.pod:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
    - name: posthog-kafka
      mountPath: /var/lib/kafka/data
      size: 10Gi
